<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="{{ '/' | relative_url }}#about-me" target="_self">Homepage</a></li>
          {% for link in site.data.navigation.main %}
            {% assign link_url = link.url %}
            {% if link_url contains '#' %}
              {% assign link_parts = link_url | split: '#' %}
              <li class="masthead__menu-item"><a href="{{ link_parts[0] | relative_url }}#{{ link_parts[1] }}" target="_self">{{ link.title }}</a></li>
            {% else %}
              <li class="masthead__menu-item"><a href="{{ link_url | relative_url }}" target="_self">{{ link.title }}</a></li>
            {% endif %}
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
